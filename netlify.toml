[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# API route must come before the SPA catch-all (first match wins)
[[redirects]]
  from = "/api/backup"
  to = "/.netlify/functions/backup"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
